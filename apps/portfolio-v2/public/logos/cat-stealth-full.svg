<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 180 210"
  width="100%"
  height="100%"
  shape-rendering="geometricPrecision"
  role="img"
  aria-label="danimtx Full 2D Stealth Cat"
>
  <defs>
    <!-- Rich Cyber Lime Gradient -->
    <linearGradient id="stealthFullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FF38" />
      <stop offset="50%" stop-color="#D4F014" />
      <stop offset="100%" stop-color="#96D600" />
    </linearGradient>

    <!-- Ground Shadow Radial Gradient -->
    <radialGradient id="catFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="90" cy="196" rx="52" ry="8" fill="url(#catFloorShadow)" />

  <!-- ================= TAIL (Fluid Sine-Wave Bezier Tail) ================= -->
  <g>
    <!-- Outer Lime Gradient Rim -->
    <path
      d="M 120 178 C 142 172, 160 148, 150 114"
      stroke="url(#stealthFullGrad)"
      stroke-width="11"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Inner Dark Body Core -->
    <path
      d="M 120 178 C 142 172, 160 148, 150 114"
      stroke="#141414"
      stroke-width="6.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Glowing Cyber Lime Tip -->
    <circle cx="150" cy="114" r="3.2" fill="#D4F014" />
    <circle cx="150" cy="114" r="1.4" fill="#F7FF9E" />
  </g>

  <!-- ================= SITTING BODY & HIND HAUNCHES ================= -->
  <!-- Left Sitting Haunch / Hip -->
  <path
    d="M66,144 C50,152 46,168 50,184 C52,190 62,192 68,190 C62,180 62,160 68,146 Z"
    fill="#121214"
    stroke="url(#stealthFullGrad)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Right Sitting Haunch / Hip -->
  <path
    d="M114,144 C130,152 134,168 130,184 C128,190 118,192 112,190 C118,180 118,160 112,146 Z"
    fill="#121214"
    stroke="url(#stealthFullGrad)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Streamlined Sitting Torso Chassis -->
  <polygon
    points="76,104 104,104 116,146 122,176 114,190 66,190 58,176 64,146"
    fill="#141414"
    stroke="url(#stealthFullGrad)"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Chest Armor Facet Plate -->
  <polygon
    points="80,114 100,114 96,150 90,166 84,150"
    fill="#18181B"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Cyber Spine Seam Line -->
  <line
    x1="90"
    y1="116"
    x2="90"
    y2="174"
    stroke="url(#stealthFullGrad)"
    stroke-width="1.2"
    stroke-opacity="0.4"
    stroke-dasharray="3 3"
  />

  <!-- Sleek Cyber Collar V-Line & Reactor Node -->
  <path
    d="M78,102 L90,114 L102,102"
    stroke="#D4F014"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <circle cx="90" cy="114" r="2.5" fill="#D4F014" />
  <circle cx="90" cy="114" r="1.1" fill="#F7FF9E" />

  <!-- ================= FRONT PAWS & FORELEGS ================= -->
  <!-- Left Foreleg & Paw -->
  <g stroke-linejoin="round">
    <path
      d="M78,142 L74,180 L70,182 C67,185 67,192 73,192 C77,192 80,188 82,185 L84,146 Z"
      fill="#161618"
      stroke="url(#stealthFullGrad)"
      stroke-width="2.2"
    />
    <line x1="72" y1="188" x2="72" y2="191" stroke="#D4F014" stroke-width="1.5" stroke-linecap="round" />
    <line x1="76" y1="188" x2="76" y2="191" stroke="#D4F014" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Right Foreleg & Paw -->
  <g stroke-linejoin="round">
    <path
      d="M102,142 L106,180 L110,182 C113,185 113,192 107,192 C103,192 100,188 98,185 L96,146 Z"
      fill="#161618"
      stroke="url(#stealthFullGrad)"
      stroke-width="2.2"
    />
    <line x1="104" y1="188" x2="104" y2="191" stroke="#D4F014" stroke-width="1.5" stroke-linecap="round" />
    <line x1="108" y1="188" x2="108" y2="191" stroke="#D4F014" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- ================= HEAD SECTION (Centered at x = 90) ================= -->
  <!-- Left Ear -->
  <polygon points="60,22 78,52 56,52" fill="url(#stealthFullGrad)" stroke-linejoin="round" />
  <polygon points="63,28 75,50 58.5,50" fill="#141414" />
  <circle cx="66" cy="42" r="1.1" fill="#D4F014" fill-opacity="0.75" />

  <!-- Right Ear -->
  <polygon points="120,22 124,52 102,52" fill="url(#stealthFullGrad)" stroke-linejoin="round" />
  <polygon points="117,28 121.5,50 105,50" fill="#141414" />
  <circle cx="114" cy="42" r="1.1" fill="#D4F014" fill-opacity="0.75" />

  <!-- Crown Bridge Between Ears -->
  <path d="M78,52 L102,52 L90,62 Z" fill="#1C1C1E" stroke="url(#stealthFullGrad)" stroke-width="2" stroke-linejoin="round" />

  <!-- Forehead Diamond Reactor -->
  <polygon points="90,45 95,52 90,59 85,52" fill="#18181A" stroke="url(#stealthFullGrad)" stroke-width="1.2" stroke-linejoin="round" />
  <circle cx="90" cy="52" r="1.5" fill="#D4F014" />

  <!-- Sleek Cat Mask Outline -->
  <polygon
    points="56,52 90,38 124,52 120,84 90,102 60,84"
    fill="#141414"
    stroke="url(#stealthFullGrad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Cheek/Chin Contour Line -->
  <polygon
    points="61,56 90,43 119,56 115.5,81 90,96 64.5,81"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.07"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Slit Eyes -->
  <!-- Left Eye -->
  <polygon points="68,63 84,66 73,74" fill="url(#stealthFullGrad)" />
  <polygon points="71,64.5 81,66.5 74,72" fill="#F7FF9E" />
  <line x1="76.5" y1="65" x2="75" y2="71" stroke="#101010" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="75.5" cy="67" r="0.7" fill="#FFFFFF" />

  <!-- Right Eye -->
  <polygon points="112,63 96,66 107,74" fill="url(#stealthFullGrad)" />
  <polygon points="109,64.5 99,66.5 106,72" fill="#F7FF9E" />
  <line x1="103.5" y1="65" x2="105" y2="71" stroke="#101010" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="104.5" cy="67" r="0.7" fill="#FFFFFF" />

  <!-- Nose Prompt Terminal -->
  <circle cx="90" cy="80" r="2.6" fill="#D4F014" />

  <!-- Whiskers as Code Indent Slashes (//) -->
  <g stroke="#D4F014" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="50" y1="72" x2="66" y2="72" />
    <line x1="52" y1="80" x2="68" y2="78" />
    <line x1="130" y1="72" x2="114" y2="72" />
    <line x1="128" y1="80" x2="112" y2="78" />
  </g>
</svg>
