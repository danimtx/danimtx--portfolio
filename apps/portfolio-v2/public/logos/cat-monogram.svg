<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D4F014" />
      <stop offset="100%" stopColor="#8AC600" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="120" height="120" rx="60" fill="#101010" />

  <!-- Single Continuous Line Monogram (D + M + Cat Silhouette) -->
  <!-- Left Side: 'd' Ascender forming the Left Ear -->
  <path
    d="M34,88 L34,36 L48,18 L54,46 L60,36 L66,46 L72,18 L86,36 L86,88"
    fill="none"
    stroke="url(#monoGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Internal 'd' and 'm' cross connection & snout -->
  <path
    d="M34,60 C42,60 50,66 50,74 C50,82 42,88 34,88"
    fill="none"
    stroke="url(#monoGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <path
    d="M86,60 C78,60 70,66 70,74 C70,82 78,88 86,88"
    fill="none"
    stroke="url(#monoGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Minimal Cat Eyes (Geometric slanted diamonds) -->
  <circle cx="48" cy="56" r="3.5" fill="#D4F014" />
  <circle cx="72" cy="56" r="3.5" fill="#D4F014" />

  <!-- Central prompt triangle / nose -->
  <polygon points="60,68 56,62 64,62" fill="#FFFFFF" />
</svg>
