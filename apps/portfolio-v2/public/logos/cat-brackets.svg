<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D4F014" />
      <stop offset="100%" stopColor="#9EE000" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="120" height="120" rx="60" fill="#101010" />

  <!-- Code Bracket Cat Silhouette -->
  <!-- Left Ear (Angle Bracket < pointing up) -->
  <path
    d="M26,44 L44,22 L52,42"
    fill="none"
    stroke="url(#bracketGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Ear (Angle Bracket > pointing up) -->
  <path
    d="M68,42 L76,22 L94,44"
    fill="none"
    stroke="url(#bracketGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Head Contour: Open Curly Bracket Syntax -->
  <path
    d="M26,52 C22,68 28,88 44,96 C52,100 68,100 76,96 C92,88 98,68 94,52"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Sleek Slit Eyes / Code Terminal Prompt -->
  <path d="M40,64 L50,60" stroke="#D4F014" stroke-width="4.5" stroke-linecap="round" />
  <path d="M80,64 L70,60" stroke="#D4F014" stroke-width="4.5" stroke-linecap="round" />

  <!-- Minimal Nose & Code Whiskers (//) -->
  <circle cx="60" cy="74" r="2.5" fill="#D4F014" />
  
  <!-- Left Whiskers -->
  <line x1="16" y1="68" x2="32" y2="70" stroke="url(#bracketGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="18" y1="78" x2="34" y2="76" stroke="url(#bracketGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Whiskers -->
  <line x1="104" y1="68" x2="88" y2="70" stroke="url(#bracketGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="102" y1="78" x2="86" y2="76" stroke="url(#bracketGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
