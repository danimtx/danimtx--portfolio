<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- High-tech linear gradient -->
    <linearGradient id="cyberLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E5FF2E" />
      <stop offset="100%" stopColor="#A6E600" />
    </linearGradient>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#D4F014" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#D4F014" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Background container -->
  <rect width="120" height="120" rx="32" fill="#101010" />
  <circle cx="60" cy="60" r="45" fill="url(#cyberGlow)" />

  <!-- CyberCat Geometric Mask / Head -->
  <!-- Left Ear -->
  <polygon points="28,22 46,50 24,54" fill="url(#cyberLime)" opacity="0.9" />
  <!-- Right Ear -->
  <polygon points="92,22 96,54 74,50" fill="url(#cyberLime)" opacity="0.9" />

  <!-- Head Base Outline -->
  <polygon points="28,50 60,32 92,50 96,78 60,102 24,78" fill="#161616" stroke="url(#cyberLime)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Forehead Code Diamond / Vertex -->
  <polygon points="60,42 70,54 60,66 50,54" fill="#1F1F1F" stroke="#D4F014" stroke-width="1.8" />
  <circle cx="60" cy="54" r="2.5" fill="#D4F014" />

  <!-- Angular Cyber Eyes -->
  <polygon points="36,66 52,68 42,76" fill="#D4F014" />
  <polygon points="84,66 78,76 68,68" fill="#D4F014" />

  <!-- Nose & Whiskers Facets -->
  <polygon points="57,80 63,80 60,85" fill="#D4F014" />
  <line x1="20" y1="74" x2="32" y2="76" stroke="#D4F014" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <line x1="22" y1="84" x2="34" y2="82" stroke="#D4F014" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <line x1="100" y1="74" x2="88" y2="76" stroke="#D4F014" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <line x1="98" y1="84" x2="86" y2="82" stroke="#D4F014" stroke-width="2" stroke-linecap="round" opacity="0.75" />
</svg>
