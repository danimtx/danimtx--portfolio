<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="stealthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D4F014" />
      <stop offset="100%" stopColor="#A8DE08" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="120" height="120" rx="36" fill="#101010" />

  <!-- Clean Precision Feline Geometry -->
  <!-- Left Ear -->
  <polygon points="30,22 48,52 26,52" fill="url(#stealthGrad)" />
  
  <!-- Right Ear -->
  <polygon points="90,22 94,52 72,52" fill="url(#stealthGrad)" />

  <!-- Crown bridge between ears -->
  <path d="M48,52 L72,52 L60,62 Z" fill="#1E1E1E" stroke="url(#stealthGrad)" stroke-width="2" />

  <!-- Sleek Cat Mask Outline -->
  <polygon
    points="26,52 60,38 94,52 90,84 60,102 30,84"
    fill="#141414"
    stroke="url(#stealthGrad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- High-Tech Slit Eyes -->
  <polygon points="40,64 54,66 44,74" fill="#D4F014" />
  <polygon points="80,64 66,66 76,74" fill="#D4F014" />

  <!-- Nose prompt -->
  <circle cx="60" cy="80" r="2.5" fill="#D4F014" />

  <!-- Whiskers as code indent slashes -->
  <line x1="22" y1="72" x2="36" y2="72" stroke="#D4F014" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="24" y1="80" x2="38" y2="78" stroke="#D4F014" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  
  <line x1="98" y1="72" x2="84" y2="72" stroke="#D4F014" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="96" y1="80" x2="82" y2="78" stroke="#D4F014" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>
